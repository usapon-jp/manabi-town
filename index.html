<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d8eefa">
  <meta name="description" content="宿題とテストを管理して、勉強するほど草原に街が育つ家庭教師アプリ">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="まなびタウン">
  <title>まなびタウン</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/icons/favicon-48.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="splash" class="splash">
    <img src="assets/icons/icon-192.png" alt="" width="112" height="112">
    <p class="splash-name">まなびタウン</p>
    <p class="splash-note">草原をよういしているよ…</p>
  </div>
  <div id="world" class="world"></div>
  <header id="hud" class="hud" hidden></header>
  <section id="bubble" class="bubble" hidden></section>
  <div id="pad" class="pad" hidden>
    <div id="joy"><i class="chev u"></i><i class="chev d"></i><i class="chev l"></i><i class="chev r"></i><div id="knob"></div></div>
    <button id="btnDash" class="tb" type="button" aria-label="ダッシュ"><svg class="mk-ic" viewBox="0 0 48 48" aria-hidden="true"><path class="mk-k mk-fa" d="M13 12.4c-.8-1.1.4-2.5 1.6-1.9l16.6 9.6c1.4.8 1.4 2.8 0 3.6l-16.6 9.6c-1.2.6-2.4-.8-1.6-1.9l7.4-9.5c.4-.5.4-1.2 0-1.7z" transform="translate(5 1)"/><path class="mk-k" d="M5.5 17h6M3.5 24h7M5.5 31h6"/></svg></button>
    <button id="btnJump" class="tb" type="button" aria-label="ジャンプ"><svg class="mk-ic" viewBox="0 0 48 48" aria-hidden="true"><ellipse class="mk-k mk-fb" cx="24" cy="40" rx="10" ry="3.2"/><path class="mk-k mk-fa" d="M24 7.6c.9 0 1.6.4 2.1 1.1l8.3 11.3c.9 1.3 0 3.1-1.6 3.1h-4.3v6.2c0 1.3-1.1 2.4-2.4 2.4h-4.2c-1.3 0-2.4-1.1-2.4-2.4v-6.2h-4.3c-1.6 0-2.5-1.8-1.6-3.1l8.3-11.3c.5-.7 1.2-1.1 2.1-1.1z"/></svg></button>
  </div>
  <main id="panel" class="panel" hidden></main>
  <nav class="tabs" hidden>
    <button data-tab="home" class="active"><span>🌱</span>ホーム</button>
    <button data-tab="todo"><span>📅</span>やること</button>
    <button data-tab="quest"><span>✏️</span>クエスト</button>
    <button data-tab="settings"><span>⚙️</span>せってい</button>
  </nav>
  <div id="runner" class="runner" hidden></div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
